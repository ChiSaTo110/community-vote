<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参与投票</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <h2 class="text-center mb-4" id="voteTitle">加载中...</h2>
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="voteForm">
                        <div id="optionContainer" class="mb-3"></div>
                        <button type="submit" class="btn btn-primary w-100">提交投票</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 读取URL参数
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    const topicId = getQueryParam('id');

    // 加载投票详情
    window.onload = function() {
        if (!topicId) {
            document.getElementById('voteTitle').textContent = '无效的投票链接';
            return;
        }

        axios.get(`/api/topics/${topicId}`)
            .then(res => {
                const topic = res.data;
                document.getElementById('voteTitle').textContent = topic.title;

                const isMultiple = topic.type === 'multiple';
                const inputType = isMultiple ? 'checkbox' : 'radio';
                const inputName = isMultiple ? 'options' : 'option';
                const container = document.getElementById('optionContainer');

                topic.options.forEach(option => {
                    const div = document.createElement('div');
                    div.className = 'form-check mb-2';
                    div.innerHTML = `
                            <input class="form-check-input" type="${inputType}" name="${inputName}" value="${option.id}" id="opt-${option.id}">
                            <label class="form-check-label" for="opt-${option.id}">${option.content || option.text}</label>
                        `;
                    container.appendChild(div);
                });
            })
            .catch(err => {
                console.error('加载失败:', err);
                document.getElementById('voteTitle').textContent = '加载投票失败';
            });
    };

    // 提交投票
    document.getElementById('voteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const selected = document.querySelectorAll('input[name="option"]:checked, input[name="options"]:checked');
        const optionIds = Array.from(selected).map(i => i.value);

        if (optionIds.length === 0) {
            alert('请选择至少一个选项');
            return;
        }

        axios.post('/api/vote', { topicId, optionIds })
            .then(() => {
                window.location.href = `result.html?id=${topicId}`;
            })
            .catch(err => {
                alert(err.response?.data?.message || '投票失败，您可能已经投过票');
            });
    });
</script>
</body>
</html>
