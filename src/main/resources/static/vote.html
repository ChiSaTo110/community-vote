<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>参与投票</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <h2 class="text-center mb-4" id="voteTitle">加载中...</h2>
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="voteForm">
                        <div id="optionContainer" class="mb-3"></div>
                        <button type="submit" class="btn btn-primary w-100">提交投票</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
</script>
<script>
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    var topicId = getQueryParam('id');

    window.onload = function() {
        if (!topicId) {
            document.getElementById('voteTitle').textContent = '无效的投票链接';
            return;
        }

        axios.get('/api/topics/' + topicId)
            .then(function(res) {
                var topic = res.data.data;
                document.getElementById('voteTitle').textContent = topic.title;

                var isMultiple = (topic.type === 2);
                var inputType = isMultiple ? 'checkbox' : 'radio';
                var inputName = isMultiple ? 'options' : 'option';
                var container = document.getElementById('optionContainer');
                container.innerHTML = '';

                // 修复：使用后端返回的 id 和 optionText
                topic.options.forEach(function(option) {
                    var div = document.createElement('div');
                    div.className = 'form-check mb-2';
                    div.innerHTML = `
                        <input class="form-check-input" type="${inputType}" name="${inputName}" value="${option.id}" id="opt-${option.id}" />
                        <label class="form-check-label" for="opt-${option.id}">${option.optionText}</label>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(function(err) {
                console.error('加载失败:', err);
                document.getElementById('voteTitle').textContent = '加载投票失败，请检查ID是否正确';
            });
    };

    document.getElementById('voteForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var selected = document.querySelectorAll('input[name="option"]:checked, input[name="options"]:checked');
        var optionIds = Array.from(selected).map(function(i) { return Number(i.value); });

        if (optionIds.length === 0) {
            alert('请选择至少一个选项');
            return;
        }

        axios.post('/api/vote', {
                topicId: Number(topicId),
                optionIds: optionIds
            })
            .then(function() {
                window.location.href = 'result.html?id=' + topicId;
            })
            .catch(function(err) {
                var msg = err.response?.data?.msg || '投票失败，您可能已经投过票了';
                alert(msg);
            });
    });
</script>
</body>
</html>
