<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参与投票 - 线上投票调研系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container-narrow py-5">
        <!-- 加载中 -->
        <div id="loadingView" class="text-center py-5">
            <div class="spinner" style="margin:0 auto 16px;"></div>
            <p class="text-muted">加载投票信息中...</p>
        </div>

        <!-- 投票不存在 -->
        <div id="notFoundView" style="display:none;" class="text-center py-5">
            <div style="font-size:4rem; margin-bottom:16px;">😕</div>
            <h3>投票不存在或已被删除</h3>
            <p class="text-muted">请确认投票 ID 是否正确</p>
            <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
        </div>

        <!-- 投票主体 -->
        <div id="voteView" style="display:none;">
            <!-- 投票信息卡片 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-between align-center mb-2 flex-wrap gap-2">
                        <span class="badge badge-primary" id="typeBadge">单选</span>
                        <span class="badge badge-success" id="statusBadge">进行中</span>
                    </div>
                    <h2 id="voteTitle" style="margin:0 0 12px; font-size:1.4rem;"></h2>
                    <p id="voteDesc" class="text-muted" style="margin:0; line-height:1.6;"></p>
                    <div class="text-small text-muted mt-3" id="voteMeta"></div>
                </div>
            </div>

            <!-- 投票选项/填空 -->
            <div class="card mb-4">
                <div class="card-body">
                    <form id="voteForm">
                        <div id="optionContainer"></div>
                        <div id="fillContainer" style="display:none;">
                            <label class="form-label">请填写你的答案</label>
                            <textarea class="form-control" id="fillText" rows="4" placeholder="请输入你的回答..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg mt-4" id="submitBtn">提交投票</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="javascript:void(0)" id="viewResultLink" class="text-small">查看投票结果 →</a>
                    </div>
                </div>
            </div>

            <!-- 评论区 -->
            <div class="card">
                <div class="card-header d-flex justify-between align-center">
                    <span>💬 评论区</span>
                    <span class="text-small text-muted" id="commentCount">0 条评论</span>
                </div>
                <div class="card-body">
                    <div class="comment-input-box">
                        <input type="text" class="form-control" id="commentInput" placeholder="发表你的看法..." maxlength="500">
                        <button class="btn btn-primary" id="commentBtn">发布</button>
                    </div>
                    <div class="comment-list" id="commentList">
                        <div class="text-center text-muted py-4">暂无评论，快来抢沙发～</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>线上投票调研系统 · 软件项目综合实践</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        // 页面初始化：先确保错误提示隐藏
        document.getElementById('notFoundView').style.display = 'none';
        renderNavbar();

        const topicId = getQueryParam('id');
        let topicData = null;

        if (!topicId || !/^\d+$/.test(topicId)) {
            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('notFoundView').style.display = 'block';
        } else {
            loadTopic();
        }

        function loadTopic() {
            TopicAPI.getDetail(topicId).then(res => {
                document.getElementById('loadingView').style.display = 'none';
                document.getElementById('notFoundView').style.display = 'none';
                if (res.code !== 200 || !res.data) {
                    document.getElementById('notFoundView').style.display = 'block';
                    return;
                }
                topicData = res.data;
                renderTopic();
                RecentStore.add(topicData.id, topicData.title, topicData.type);
                loadComments();
            }).catch(() => {
                document.getElementById('loadingView').style.display = 'none';
                document.getElementById('notFoundView').style.display = 'block';
            });
        }

        function renderTopic() {
    document.getElementById('notFoundView').style.display = 'none';
    document.getElementById('voteView').style.display = 'block';
    const typeInfo = TOPIC_TYPE[topicData.type] || { name: '未知', icon: '?' };
    document.getElementById('typeBadge').textContent = `${typeInfo.icon} ${typeInfo.name}`;
    document.getElementById('voteTitle').textContent = topicData.title;
    document.getElementById('voteDesc').textContent = topicData.description || '暂无描述';

    // 顶部发起人信息
    const nickname = topicData.creatorNickname || '匿名用户';
    const username = topicData.creatorUsername || 'anonymous';
    const avatar = topicData.creatorAvatar;
    const creatorHtml = avatar
        ? `<img src="${avatar}" class="topic-avatar" alt="avatar">`
        : `<div class="topic-avatar">${nickname.charAt(0).toUpperCase()}</div>`;

    document.getElementById('voteMeta').innerHTML = `
        <div class="topic-card-header" style="margin-bottom:8px;">
            ${creatorHtml}
            <div class="topic-user-info">
                <div class="topic-user-name">${escapeHtml(nickname)}</div>
                <div class="topic-user-meta">@${escapeHtml(username)} · ${formatTimeAgo(topicData.createdAt)}</div>
            </div>
        </div>
        <div style="font-size:0.82rem; color:var(--text-light);">
            📋 ${topicData.optionCount || topicData.options?.length || 0} 个选项 · 👥 ${topicData.voteCount || 0} 人参与
        </div>
    `;

    const status = TOPIC_STATUS[topicData.status] || { text: '未知', class: 'badge-warning' };
    const statusBadge = document.getElementById('statusBadge');
    statusBadge.textContent = status.text;
    statusBadge.className = `badge ${status.class}`;

    if (topicData.status === 2) {
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = '投票已结束';
    }

    document.getElementById('viewResultLink').onclick = () => navigateTo(`result.html?id=${topicId}`);

    if (topicData.type === 3) {
        document.getElementById('optionContainer').style.display = 'none';
        document.getElementById('fillContainer').style.display = 'block';
    } else {
        document.getElementById('fillContainer').style.display = 'none';
        renderOptions();
    }
}

        function renderOptions() {
            const isMultiple = topicData.type === 2;
            const inputType = isMultiple ? 'checkbox' : 'radio';
            const inputName = isMultiple ? 'options' : 'option';
            const container = document.getElementById('optionContainer');
            container.style.display = 'block';

            container.innerHTML = topicData.options.map(opt => `
                <label class="form-check" data-id="${opt.id}">
                    <input type="${inputType}" class="form-check-input" name="${inputName}" value="${opt.id}">
                    <span class="form-check-label">${escapeHtml(opt.optionText)}</span>
                </label>
            `).join('');

            container.addEventListener('change', e => {
                if (e.target.classList.contains('form-check-input')) {
                    if (!isMultiple) {
                        container.querySelectorAll('.form-check').forEach(fc => fc.classList.remove('selected'));
                    }
                    e.target.closest('.form-check').classList.toggle('selected', e.target.checked);
                }
            });
        }

        // 提交投票
        document.getElementById('voteForm').addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            if (btn.disabled) return;

            let optionIds = [];
            let fillText = null;

            if (topicData.type === 3) {
                fillText = document.getElementById('fillText').value.trim();
                if (!fillText) {
                    showToast('请填写内容', 'warning');
                    return;
                }
            } else {
                const selected = document.querySelectorAll('input[name="option"]:checked, input[name="options"]:checked');
                optionIds = Array.from(selected).map(i => Number(i.value));
                if (optionIds.length === 0) {
                    showToast(topicData.type === 1 ? '请选择一个选项' : '请至少选择一个选项', 'warning');
                    return;
                }
            }

            btn.disabled = true;
            btn.textContent = '提交中...';

            VoteAPI.submit({ topicId: Number(topicId), optionIds, fillText })
                .then(res => {
                    if (res.code === 200) {
                        showToast('投票成功！', 'success');
                        // C-10：投票成功后跳转结果页
                        setTimeout(() => navigateTo(`result.html?id=${topicId}`), 1000);
                    } else {
                        showToast(res.msg || '投票失败', 'error');
                        btn.disabled = false;
                        btn.textContent = '提交投票';
                    }
                })
                .catch(err => {
                    console.error(err);
                    showToast('投票失败，请稍后重试', 'error');
                    btn.disabled = false;
                    btn.textContent = '提交投票';
                });
        });

        // ========== 评论区 ==========
        function loadComments() {
            CommentAPI.getList(topicId).then(list => {
                const container = document.getElementById('commentList');
                document.getElementById('commentCount').textContent = `${list.length} 条评论`;
                if (!list || list.length === 0) {
                    container.innerHTML = '<div class="text-center text-muted py-4">暂无评论，快来抢沙发～</div>';
                    return;
                }
                container.innerHTML = list.map(c => {
                    const sentimentMap = {
                        'POSITIVE': { text: '😊', class: 'badge-success' },
                        'NEGATIVE': { text: '😞', class: 'badge-danger' },
                        'NEUTRAL': { text: '😐', class: 'badge-warning' }
                    };
                    const s = sentimentMap[c.sentiment] || null;
                    return `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-user">匿名用户 ${c.ipAddress ? '(' + maskIp(c.ipAddress) + ')' : ''}</span>
                                <span class="comment-time">${formatTime(c.createTime)}</span>
                            </div>
                            <div class="comment-content">${escapeHtml(c.content)}</div>
                            ${s ? `<div class="mt-1"><span class="badge ${s.class} comment-sentiment">${s.text}</span></div>` : ''}
                        </div>
                    `;
                }).join('');
            }).catch(() => {});
        }

        document.getElementById('commentBtn').addEventListener('click', submitComment);
        document.getElementById('commentInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitComment();
        });

        function submitComment() {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            if (!content) {
                showToast('请输入评论内容', 'warning');
                return;
            }
            CommentAPI.add(topicId, content).then(() => {
                showToast('评论发布成功', 'success');
                input.value = '';
                loadComments();
            }).catch(() => {
                showToast('评论发布失败', 'error');
            });
        }
    </script>
</body>
</html>
