<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>参与投票</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .btn-primary {
            background: #4A90D9;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #357ABD;
            transform: scale(1.02);
        }
        h2 {
            color: #2c3e50;
            font-weight: 700;
        }
        .form-check-input:checked {
            background-color: #4A90D9;
            border-color: #4A90D9;
        }
        .form-control:focus {
            border-color: #4A90D9;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 217, 0.25);
        }
        #fillInput {
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <h2 class="text-center mb-4" id="voteTitle">加载中...</h2>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="voteForm">
                        <div id="optionContainer" class="mb-3"></div>
                        <button type="submit" class="btn btn-primary w-100">提交投票</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
</script>
<script>
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    var topicId = getQueryParam('id');

    // 存储当前投票类型，供提交时使用
    var currentTopicType = null;

    window.onload = function() {
        if (!topicId) {
            document.getElementById('voteTitle').textContent = '无效的投票链接';
            return;
        }

        axios.get('/api/topics/' + topicId)
            .then(function(res) {
                var topic = res.data.data;
                currentTopicType = topic.type;
                document.getElementById('voteTitle').textContent = topic.title;

                var container = document.getElementById('optionContainer');
                container.innerHTML = '';

                // ===== 填空题型 =====
                if (topic.type === 3) {
                    var div = document.createElement('div');
                    div.className = 'mb-3';
                    div.innerHTML = `
                        <label class="form-label" for="fillInput">请输入您的回答：</label>
                        <input type="text" class="form-control" id="fillInput" placeholder="请输入内容" required />
                    `;
                    container.appendChild(div);

                } else {
                    // ===== 单选 / 多选 =====
                    var isMultiple = (topic.type === 2);
                    var inputType = isMultiple ? 'checkbox' : 'radio';
                    var inputName = isMultiple ? 'options' : 'option';

                    topic.options.forEach(function(option) {
                        var div = document.createElement('div');
                        div.className = 'form-check mb-2';
                        div.innerHTML = `
                            <input class="form-check-input" type="${inputType}" name="${inputName}" value="${option.id}" id="opt-${option.id}" />
                            <label class="form-check-label" for="opt-${option.id}">${option.optionText}</label>
                        `;
                        container.appendChild(div);
                    });
                }
            })
            .catch(function(err) {
                console.error('加载失败:', err);
                document.getElementById('voteTitle').textContent = '加载投票失败，请检查ID是否正确';
            });
    };

    // ===== 提交投票 =====
    document.getElementById('voteForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 如果是填空
        if (currentTopicType === 3) {
            var fillText = document.getElementById('fillInput')?.value?.trim();
            if (!fillText) {
                alert('请填写内容');
                return;
            }
            axios.post('/api/vote', {
                    topicId: Number(topicId),
                    fillText: fillText
                })
                .then(function() {
                    window.location.href = 'result.html?id=' + topicId;
                })
                .catch(function(err) {
                    var msg = err.response?.data?.msg || '投票失败，您可能已经投过票了';
                    alert(msg);
                });
            return;
        }

        // 单选 / 多选
        var selected = document.querySelectorAll('input[name="option"]:checked, input[name="options"]:checked');
        var optionIds = Array.from(selected).map(function(i) { return Number(i.value); });

        if (optionIds.length === 0) {
            alert('请选择至少一个选项');
            return;
        }

        axios.post('/api/vote', {
                topicId: Number(topicId),
                optionIds: optionIds
            })
            .then(function() {
                window.location.href = 'result.html?id=' + topicId;
            })
            .catch(function(err) {
                var msg = err.response?.data?.msg || '投票失败，您可能已经投过票了';
                alert(msg);
            });
    });
</script>
</body>
</html>
