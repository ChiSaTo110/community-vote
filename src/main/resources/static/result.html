<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>投票结果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-sm-12">
            <h2 class="text-center mb-4" id="resultTitle">加载中...</h2>

            <div class="d-flex justify-content-center gap-2 mb-3">
                <button class="btn btn-primary btn-sm" id="pieBtn">饼图</button>
                <button class="btn btn-outline-secondary btn-sm" id="barBtn">柱状图</button>
                <button class="btn btn-outline-success btn-sm ms-auto" id="copyLinkBtn">复制投票链接</button>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <div id="chart" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">🤖 AI 分析报告</h5>
                </div>
                <div class="card-body">
                    <div id="aiReport" class="text-muted">正在生成AI报告...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
</script>
<script>
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    const topicId = getQueryParam('id');
    let chartInstance = null;
    let chartData = [];

    function renderChart(type) {
        type = type || 'pie';
        if (!chartInstance) {
            chartInstance = echarts.init(document.getElementById('chart'));
            window.addEventListener('resize', function() {
                chartInstance.resize();
            });
        }

        var option = {};
        if (type === 'pie') {
            option = {
                title: { text: '投票结果分布', left: 'center' },
                tooltip: { trigger: 'item', formatter: '{b}: {c}票 ({d}%)' },
                legend: { orient: 'vertical', left: 'left', bottom: 0 },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: chartData,
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(0,0,0,0.5)'
                        }
                    }
                }]
            };
        } else {
            option = {
                title: { text: '投票结果统计', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: chartData.map(function(i) { return i.name; })
                },
                yAxis: {
                    type: 'value',
                    name: '票数'
                },
                series: [{
                    type: 'bar',
                    data: chartData.map(function(i) { return i.value; }),
                    itemStyle: { color: '#409eff' }
                }]
            };
        }
        chartInstance.setOption(option, true);
    }

    function loadResults() {
        if (!topicId) {
            document.getElementById('resultTitle').textContent = '无效的投票ID';
            return;
        }

        axios.get('/api/topics/' + topicId)
            .then(function(res) {
                var topic = res.data.data;
                document.getElementById('resultTitle').textContent = topic.title + ' - 结果';
            })
            .catch(function() {
                document.getElementById('resultTitle').textContent = '加载投票信息失败';
            });

        axios.get('/api/topics/' + topicId + '/results')
            .then(function(res) {
                var data = res.data.data;
                chartData = data.labels.map(function(label, index) {
                    return {
                        name: label,
                        value: data.values[index]
                    };
                });
                renderChart('pie');
            })
            .catch(function(err) {
                console.error('加载结果失败:', err);
                document.getElementById('resultTitle').textContent = '加载结果失败';
            });
    }

   function loadAiReport() {
    if (!topicId) return;

    var el = document.getElementById('aiReport');
    el.textContent = '⏳ 正在生成AI报告，请稍候...';
    el.classList.remove('text-muted');

    axios.get('/api/ai/report/' + topicId, { timeout: 30000 })
        .then(function(res) {
            console.log('AI报告响应:', res.data);  // 调试日志

            // 兼容多种返回格式：
            // 1. { code: 200, data: "报告文本" }
            // 2. { code: 200, report: "报告文本" }
            // 3. { code: 200, content: "报告文本" }
            // 4. 直接返回字符串 "报告文本"
            var report = null;
            if (typeof res.data === 'string') {
                report = res.data;
            } else if (res.data.data && typeof res.data.data === 'string') {
                report = res.data.data;
            } else if (res.data.report && typeof res.data.report === 'string') {
                report = res.data.report;
            } else if (res.data.content && typeof res.data.content === 'string') {
                report = res.data.content;
            } else {
                // 如果都不是，把整个对象转为字符串显示（方便调试）
                report = JSON.stringify(res.data, null, 2);
            }

            el.textContent = report;
            el.classList.remove('text-muted');
        })
        .catch(function(err) {
            console.error('AI报告加载失败:', err);
            if (err.code === 'ECONNABORTED') {
                el.textContent = '⏰ AI报告生成超时（超过30秒），请稍后刷新页面重试';
            } else {
                el.textContent = '❌ AI报告生成失败，请检查后端服务是否正常';
            }
            el.classList.remove('text-muted');
        });
}

    document.getElementById('pieBtn').onclick = function() {
        this.className = 'btn btn-primary btn-sm';
        document.getElementById('barBtn').className = 'btn btn-outline-secondary btn-sm';
        renderChart('pie');
    };

    document.getElementById('barBtn').onclick = function() {
        this.className = 'btn btn-primary btn-sm';
        document.getElementById('pieBtn').className = 'btn btn-outline-secondary btn-sm';
        renderChart('bar');
    };

    document.getElementById('copyLinkBtn').onclick = function() {
        var url = window.location.origin + '/vote.html?id=' + topicId;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(function() {
                alert('投票链接已复制到剪贴板');
            }).catch(function() {
                fallbackCopy(url);
            });
        } else {
            fallbackCopy(url);
        }
    };

    function fallbackCopy(text) {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('投票链接已复制');
    }

    window.onload = function() {
        loadResults();
        loadAiReport();
    };
</script>
</body>
</html>
